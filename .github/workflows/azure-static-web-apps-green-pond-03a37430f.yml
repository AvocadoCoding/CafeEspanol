name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: my-react-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        working-directory: my-react-app
        run: npm run build

      - name: Check SWA token presence
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_POND_03A37430F }}" ]; then
            echo "SWA token secret is MISSING"; exit 1;
          else
            echo "SWA token secret is present";
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          # MUST match the secret name you created in step 2
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_POND_03A37430F }}
          action: upload
          app_location: "my-react-app"
          output_location: "build"
          skip_app_build: true






