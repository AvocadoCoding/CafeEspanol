name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      id-token: write   # ← required for OIDC

    steps:
      - uses: actions/checkout@v4

      - name: Show repo root (sanity check)
        run: ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: my-react-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build React app
        working-directory: my-react-app
        run: npm run build

      - name: Show build output (sanity check)
        run: ls -la my-react-app/build || true

      # ✅ Correct OIDC usage: do NOT require('@actions/core'). 'core' is already available.
      - name: Get GitHub OIDC Id Token
        id: idtoken
        uses: actions/github-script@v6
        with:
          script: |
            const id = await core.getIDToken();   // no require, use provided 'core'
            core.setOutput('result', id);
          result-encoding: string

      - name: Deploy to Azure Static Web Apps (OIDC)
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: "my-react-app"
          output_location: "build"
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          # optional (for PR comments/previews)
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          action: close






