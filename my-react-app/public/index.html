<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon & PWA basics -->
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
    <meta name="theme-color" content="#000000" />


    <!-- ✅ SEO -->
    <title>Adriano's Restaurante – Authentic Peruvian Cuisine in Coventry</title>
    <meta
      name="description"
      content="Enjoy fresh tasty food at Adriano's Restaurante. Dine-in and takeaway."
    />
    <!-- Optional but nice -->
    <link rel="canonical" href="https://www.adrianosrestaurante.com/" />

    <!-- 🔗 Open Graph (Facebook/WhatsApp/etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adriano's Restaurante" />
    <meta property="og:description" content="Tasty dishes, dine-in and takeaway." />
    <!-- Use a real absolute URL to a 1200x630 image you host -->
    <meta property="og:image" content="https://www.adrianosrestaurante.com/hero.jpg" />
    <meta property="og:url" content="https://www.adrianosrestaurante.com/" />

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adriano's Restaurante" />
    <meta name="twitter:description" content="Tasty dishes, dine-in and takeaway." />
    <meta name="twitter:image" content="https://www.adrianosrestaurante.com/hero.jpg" />

    <!-- (Optional) keywords — most engines ignore, harmless to include -->
    <meta name="keywords" content="Peruvian restaurant, Lima, La Molina, takeaway, Latin food, Adriano's Restaurante" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
